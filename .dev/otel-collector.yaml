# Local OpenTelemetry collector: prints what the app exports.
# Point the app at it with OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      exporters: [debug]
