apiVersion: apps/v1
kind: Deployment
metadata:
  name: wynnsource-server
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # Old ReplicaSets kept for rollback; the k8s default of 10 is noise.
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  replicas: {{ .Values.replicaCount }}
  selector:
    # Immutable on the pre-chart deployment; never change this.
    matchLabels:
      app: wynnsource-server
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: wynnsource-server
      annotations:
        checksum/config: {{ .Values.config | toYaml | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: wynnsource-config
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: wynnsource-pg-app
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: wynnsource-pg-app
                  key: port
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: wynnsource-pg-app
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wynnsource-pg-app
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: wynnsource-pg-app
                  key: dbname
            - name: REDIS_HOST
              value: wynnsource-redis
            - name: REDIS_PORT
              value: "6379"
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
