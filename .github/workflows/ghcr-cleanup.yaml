name: GHCR Cleanup

on:
  schedule:
    - cron: "0 3 * * 0" # Every Sunday at 03:00 UTC
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # dataaxiom/ghcr-cleanup-action is multi-arch aware: deleting a tag
      # removes its platform children and referrers, and untagged cleanup
      # never touches children still referenced by a tagged index. The
      # previous snok-based untagged step deleted those children after one
      # day, leaving kept dev-* tags as broken skeletons (manifest unknown).
      - name: Clean up dev images and untagged manifests
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: wynnsource-server
          delete-tags: "dev-*"
          exclude-tags: "latest,dev-latest"
          keep-n-tagged: 5
          delete-untagged: true
          # Repair pass: images already broken by the old workflow.
          delete-ghost-images: true
          delete-partial-images: true
          validate: true
